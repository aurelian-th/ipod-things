[package]
name = "revisionos-core"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
description = "Core catalog, RVX manifest, recipe assembly, and Disk Mode sync logic for RevisionOS Installer"

[dependencies]
hex = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "json"] }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"

[dev-dependencies]
tempfile = "3"

